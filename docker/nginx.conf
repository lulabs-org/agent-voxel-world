server {
    listen 80;
    server_name localhost;
    client_max_body_size 50m;

    # 静态资源 SPA 服务
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @backend;
    }

    # 后端 API 及 WebSocket 统一回退反代
    location @backend {
        proxy_pass http://server:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 显式后端路径（支持流式 SSE、长连接 WebSocket）
    location ~ ^/(world|chat|agents|providers|tasks|task-runs|voice|health|api-docs|matchmake) {
        proxy_pass http://server:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 禁用缓冲以保证 /world/presence 等 SSE 流式通信实时性
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
